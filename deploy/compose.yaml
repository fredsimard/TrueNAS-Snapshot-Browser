# TrueNAS custom app: paste into "Install via YAML" in the Apps screen. The Custom App wizard can't
# set mount propagation, and without rslave snapshots appear empty.
services:
  snapback:
    # Loaded on the NAS with `docker load`; never pulled from a registry.
    image: snapback:dev
    pull_policy: never
    # The app exits when TrueNAS replaces the host's account files (any account or group change),
    # so it has to come back up to read the new ones.
    restart: unless-stopped
    environment:
      # Required. Comma-separated snapshot name prefixes users may see.
      SNAPSHOT_PREFIXES: "auto-"
      # Required. The NAS's network address, used to check passwords. Not 127.0.0.1: inside the
      # container that's the container itself.
      SMB_HOST: "192.0.2.10"
      # Required. "all", or comma-separated usernames allowed to use the app.
      ALLOWED_USERS: "all"
      TZ: America/Toronto  # example: set the server's timezone; snapshot names are read in it
      MAX_DOWNLOAD_GB: "20"  # largest zip one download may hold
      SNAPBACK_CONFIG: /config/snapback.yaml
    ports:
      - "18080:8080"  # HTTP
      - "18443:8443"  # HTTPS, served only when the certificate below is mounted
    volumes:
      - type: bind
        source: /mnt/tank/apps/snapback/snapback.yaml
        target: /config/snapback.yaml
        read_only: true
      # The host's accounts: the app reads files as the signed-in user's uid and groups.
      - type: bind
        source: /etc/passwd
        target: /host/etc/passwd
        read_only: true
      - type: bind
        source: /etc/group
        target: /host/etc/group
        read_only: true
      # Optional: the NAS's own certificate, for HTTPS on 8443 next to HTTP on 8080. TrueNAS writes
      # each certificate it holds to /etc/certificates/<name>.crt and .key; use the one for the name
      # users type. Without these two mounts the app serves plain HTTP only.
      - type: bind
        source: /etc/certificates/nas-example-com.crt
        target: /host/tls/tls.crt
        read_only: true
      - type: bind
        source: /etc/certificates/nas-example-com.key
        target: /host/tls/tls.key
        read_only: true
      # One per distinct dataset mountpoint, same path inside and outside, read-only.
      - type: bind
        source: /mnt/tank/studio
        target: /mnt/tank/studio
        read_only: true
        bind:
          propagation: rslave
