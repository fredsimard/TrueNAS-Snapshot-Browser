# One file per server; the same image everywhere. Snapshot filtering is set by the
# SNAPSHOT_PREFIXES environment variable, not here.
server_label: "NAS01"
listen: 0.0.0.0:8080
roots:
  # label defaults to the last folder of share_root, which is usually the SMB share name.
  - id: projects
    share_root: /mnt/tank/studio/Projects
  - id: web-marketing
    share_root: "/mnt/tank/studio/Web Marketing"
  - id: video-archive
    share_root: /mnt/tank/studio/VIDEO_ARCHIVE
    # dataset_mountpoint: /mnt/tank/studio   # only if auto-detection is wrong
limits:
  max_snapshots_listed: 500
