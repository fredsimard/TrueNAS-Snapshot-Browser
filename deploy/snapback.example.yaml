# One file per server; the same image everywhere. Snapshot filtering and who may use the app are
# set by the SNAPSHOT_PREFIXES and ALLOWED_USERS environment variables, not here.
server_label: "NAS01"
listen: 0.0.0.0:8080
roots:
  # smb_share defaults to the last folder of share_root, and label to smb_share. A user sees a root
  # only if Samba lets their account connect to its smb_share.
  - id: projects
    share_root: /mnt/tank/studio/Projects
  - id: web-marketing
    share_root: "/mnt/tank/studio/Web Marketing"
  - id: video-archive
    label: "Video Archive"
    share_root: /mnt/tank/studio/VIDEO_ARCHIVE
    # smb_share: VIDEO_ARCHIVE               # only if the share's name isn't the folder's
    # dataset_mountpoint: /mnt/tank/studio   # only if auto-detection is wrong
limits:
  max_snapshots_listed: 500
