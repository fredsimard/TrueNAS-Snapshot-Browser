[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snapback"
version = "0.1.0"
description = "Self-service browsing of ZFS snapshots of an SMB share"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.54",  # ssl_context_factory: TLS with a key loaded before dropping root
    "smbprotocol>=1.15",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]

[tool.setuptools.packages.find]
include = ["snapback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
