# Phase 0 spike. Install on TrueNAS as a custom app via "Install via YAML".
# Replace /mnt/POOL/DATASET (both services, source and target) with a dataset mountpoint
# that has snapshots, and set TZ. Two services, identical except for mount propagation.
services:
  rslave:
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    init: true
    environment:
      TZ: UTC  # set to the server timezone, e.g. America/Toronto
    volumes:
      - type: bind
        source: /mnt/POOL/DATASET
        target: /mnt/POOL/DATASET
        read_only: true
        bind:
          propagation: rslave

  private:
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    init: true
    environment:
      TZ: UTC  # set to the server timezone, e.g. America/Toronto
    volumes:
      - type: bind
        source: /mnt/POOL/DATASET
        target: /mnt/POOL/DATASET
        read_only: true
